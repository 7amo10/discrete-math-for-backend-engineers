name: Java Verification CI

on:
  push:
    branches: [ main, 'feat/**', 'week-**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Java Verification Suites
        working-directory: backend-lab
        run: mvn clean test
